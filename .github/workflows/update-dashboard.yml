name: Update Zentra dashboard

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard updater
        env:
          ZENTRA_API_TOKEN: ${{ secrets.ZENTRA_API_TOKEN }}
        run: python weekly_runner.py --dashboard-only

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add app.js
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update dashboard"
          git push
